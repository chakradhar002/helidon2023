spring.application.name=myspringdemo
server.port = 9090
# MySQL Configuration for Railway Cloud
spring.datasource.url=jdbc:mysql://<MYSQLHOST>:<MYSQLPORT>/<MYSQL_DATABASE>?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=<MYSQLUSER>
spring.datasource.password=<MYSQLPASSWORD>


# Hibernate Configuration (optional)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: Connection Pool Configuration (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

